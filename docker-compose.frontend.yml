# Приложение frontend (Nuxt.js)
# Использование: docker compose -f docker-compose.frontend.yml up -d
name: universal-bot-constructor

services:
  # --- Frontend (Nuxt.js) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ubc-frontend:latest
    container_name: ubc-frontend
    restart: unless-stopped
    command: node .output/server/index.mjs
    env_file:
      - .env
    environment:
      PROJECT_ENVIRONMENT: ${PROJECT_ENVIRONMENT}
      NUXT_PUBLIC_BACKEND_URL: ${BACKEND_BASE_URL}${BACKEND_API_PREFIX}
    networks:
      - frontend
    ports:
      - "127.0.0.1:3000:3000"

networks:
  # Не external: при отдельном запуске (без srv.yml) compose создаст сеть
  # сам; если сеть уже создана (srv.yml / единый docker-compose.yml),
  # она переиспользуется по имени. External-декларация конфликтовала
  # с srv.yml при include в единый docker-compose.yml.
  frontend:
    name: ubc-frontend
