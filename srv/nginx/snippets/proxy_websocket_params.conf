# Дополнительные параметры websocket (поверх proxy_params.conf)
# Использование:
#   include /etc/nginx/snippets/proxy_params.conf;
#   include /etc/nginx/snippets/proxy_websocket_params.conf;
# Connection задаётся в proxy_params.conf через map $connection_upgrade
proxy_set_header Upgrade $http_upgrade;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
