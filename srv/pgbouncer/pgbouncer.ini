[databases]
; Пул к одной БД через unix-сокет postgres
universal_bot_constructor = host=postgres port=5432 dbname=universal_bot_constructor

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

; Режим пула: transaction — соединение возвращается в пул после каждой транзакции
pool_mode = transaction

; Лимиты
max_client_conn = 5000
max_user_connections = 500

default_pool_size = 50
reserve_pool_size = 10
reserve_pool_timeout = 5

; Аутентификация: md5 (userlist.txt)
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Логирование
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Таймауты
server_idle_timeout = 600
query_wait_timeout = 120
