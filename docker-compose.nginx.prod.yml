# Nginx + Certbot: production (http -> https, TLS Let's Encrypt)
# Подключается в docker-compose.yml при PROJECT_ENVIRONMENT=prod
# Зависит от frontend/backend/bot (depends_on) — запуск только через docker-compose.yml
# Первичный выпуск сертификата: ./init-letsencrypt.sh
name: universal-bot-constructor

services:
  nginx:
    image: nginx:1.27.5-alpine
    container_name: ubc-nginx
    restart: unless-stopped
    # upstream'ы резолвятся при старте nginx — контейнеры должны быть запущены
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      bot:
        condition: service_started
    environment:
      PROJECT_DOMAIN: ${PROJECT_DOMAIN}
      # порты upstream'ов, префикс API и лимит тела — из .env (envsubst шаблонов)
      BACKEND_PORT: ${BACKEND_PORT}
      BACKEND_API_PREFIX: ${BACKEND_API_PREFIX}
      BOT_WEBHOOK_PORT: ${BOT_WEBHOOK_PORT:-8080}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-25m}
      NGINX_RELOAD_INTERVAL: ${NGINX_RELOAD_INTERVAL:-6h}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # *.template -> /etc/nginx/conf.d/*.conf (envsubst в entrypoint образа)
      - ./srv/nginx/templates/prod:/etc/nginx/templates:ro
      - ./srv/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./srv/nginx/snippets:/etc/nginx/snippets:ro
      # фоновый nginx -s reload (каждые 6 ч) — подхват продлённых сертификатов
      - ./srv/nginx/docker-entrypoint.d/40-reload-certs.sh:/docker-entrypoint.d/40-reload-certs.sh:ro
      # сертификаты (только чтение) и webroot для HTTP-01 challenge
      - ${CERTBOT_DATA_DIR}/conf:/etc/letsencrypt:ro
      - ${CERTBOT_DATA_DIR}/www:/var/www/certbot:ro
    networks:
      - backend
      - frontend

  # Продление сертификатов (проверка каждые 12 ч; renew — за 30 дней до истечения)
  # Первичный выпуск — ./init-letsencrypt.sh (домен и e-mail — из .env)
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: ubc-certbot
    restart: unless-stopped
    environment:
      PROJECT_DOMAIN: ${PROJECT_DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    volumes:
      - ${CERTBOT_DATA_DIR}/conf:/etc/letsencrypt
      - ${CERTBOT_DATA_DIR}/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew
      --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

networks:
  # Не external: сеть переиспользуется по имени (см. docker-compose.backend.yml)
  backend:
    name: ubc-backend
  frontend:
    name: ubc-frontend
