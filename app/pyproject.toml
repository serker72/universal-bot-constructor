[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "ubc-app"
version = "0.1.0"
description = "Backend (FastAPI) + Bot (aiogram) for Universal Bot Constructor"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "faststream[rabbit]>=0.5",
    "dishka>=1.4",
    "aiogram>=3.13",
    "aiohttp>=3.10",
    "aiohttp-socks>=0.9",
    "structlog>=24.4",
    "pyjwt>=2.9",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
