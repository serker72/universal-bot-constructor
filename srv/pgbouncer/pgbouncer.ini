[databases]
; Пул к основной БД через unix-сокет postgres
universal_bot_constructor = host=postgres port=5432 dbname=universal_bot_constructor
; Пул к тестовой БД (интеграционные тесты, ALEMBIC_DB=test).
; На prod-хосте тестовую БД держать на отдельном сервере postgres: тесты
; (TRUNCATE, нагрузка) не должны делить с prod соединения и ресурсы — удалите
; эту строку в prod-конфиге или укажите host отдельного сервера.
universal_bot_constructor_test = host=postgres port=5432 dbname=universal_bot_constructor_test pool_size=10 reserve_pool=0

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

; Режим пула: transaction — соединение возвращается в пул после каждой транзакции
pool_mode = transaction

; Лимиты
max_client_conn = 5000

; Сумма серверных соединений всех пулов обязана быть меньше
; max_connections postgres (100) минус superuser_reserved_connections (3):
;   основная БД 70 + 10 (reserve) + тестовая 10 = 90 < 97
; Иначе при нагрузке postgres отвечает "too many clients already".
default_pool_size = 70
reserve_pool_size = 10
reserve_pool_timeout = 5
; жёсткий потолок на сервер postgres (сумма по всем пулам)
max_db_connections = 80
max_user_connections = 80

; Аутентификация: scram-sha-256 (userlist.txt с plaintext-паролями из .env,
; генерируется gen_userlist.sh; pgbouncer сам выполняет SCRAM-обмен)
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Логирование
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Таймауты
server_idle_timeout = 600
query_wait_timeout = 120
