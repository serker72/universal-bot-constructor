# Reverse proxy: frontend, backend API, webhook бота
# Домен из .env: PROJECT_URL_SCHEME://PROJECT_DOMAIN

upstream ubc_frontend {
    server frontend:3000;
}

upstream ubc_backend {
    server backend:8000;
}

upstream ubc_bot {
    server bot:8080;
}

server {
    listen 80;
    server_name universal-bot-constructor.loc localhost;

    # Backend API
    location /api/ {
        proxy_pass http://ubc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook бота (prod; в loc бот работает через long-polling)
    location /bot/ {
        proxy_pass http://ubc_bot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Nuxt)
    location / {
        proxy_pass http://ubc_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
