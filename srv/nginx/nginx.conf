# Основной конфиг nginx (контейнер ubc-nginx)
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # не раскрывать версию nginx в заголовке Server и страницах ошибок
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    # client_max_body_size — в server-блоках шаблонов (из .env, NGINX_CLIENT_MAX_BODY_SIZE)

    # Сжатие текстовых ответов (JSON API, JS/CSS SPA)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Connection: "upgrade" — только для websocket-запросов; для остальных
    # пустой заголовок (keepalive-соединения к upstream)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Rate-limit входа в админку (дополнительно к лимиту backend в Redis)
    limit_req_zone $binary_remote_addr zone=ubc_login:10m rate=10r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
