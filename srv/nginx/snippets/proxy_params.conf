# Общие параметры reverse proxy (HTTP)
# Использование: include /etc/nginx/snippets/proxy_params.conf;
proxy_http_version 1.1;
# пустой Connection для обычных запросов — keepalive к upstream;
# "upgrade" — для websocket (map $connection_upgrade в nginx.conf)
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# nginx — внешняя граница: X-Forwarded-For перезаписывается адресом клиента
# (клиентский заголовок не пробрасывается — иначе обход rate-limit логина)
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
