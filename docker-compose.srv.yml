# Инфраструктурные сервисы: postgresql, pgbouncer, redis, rabbitmq
# nginx — в docker-compose.nginx.{loc|prod}.yml
# Использование: docker compose -f docker-compose.srv.yml up -d
name: universal-bot-constructor

services:
  # --- PostgreSQL ---
  postgres:
    # закреплённые теги: плавающие (16-alpine, 7-alpine) дают разные версии на хостах
    image: postgres:16.14-alpine
    container_name: ubc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_DB}::${POSTGRES_USER}::${POSTGRES_PASSWORD}|${POSTGRES_TEST_DB}::${POSTGRES_TEST_USER}::${POSTGRES_TEST_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql/data
      - ${POSTGRES_BACKUPS_DIR}:/var/lib/postgresql/backups
      - ./create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # порты не публикуем наружу — только pgbouncer ходит в postgres

  # --- PgBouncer ---
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: ubc-pgbouncer
    restart: unless-stopped
    # listen_port берётся из POSTGRES_PORT (.env), а не хардкода pgbouncer.ini:
    # иначе при смене переменной проброс порта и подключение приложений ломаются
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT}
    command:
      - sh
      - -c
      - >-
        sed "s/^listen_port = .*/listen_port = $$POSTGRES_PORT/"
        /etc/pgbouncer/pgbouncer.ini > /tmp/pgbouncer.ini
        && exec /usr/bin/pgbouncer /tmp/pgbouncer.ini
    volumes:
      - ./srv/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./srv/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Redis ---
  redis:
    image: redis:7.0.4-alpine
    container_name: ubc-redis
    restart: unless-stopped
    # пароль — из окружения, а не в argv (не виден в ps / docker inspect Cmd),
    # см. srv/redis/entrypoint.sh; fail-fast при пустом пароле
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_PORT: ${REDIS_PORT}
    command: ["sh", "/usr/local/bin/ubc-redis-entrypoint.sh"]
    volumes:
      - ./srv/redis/entrypoint.sh:/usr/local/bin/ubc-redis-entrypoint.sh:ro
      - ${REDIS_DATA_DIR}:/data
    networks:
      - backend
    ports:
      - "127.0.0.1:${REDIS_PORT}:${REDIS_PORT}"
    healthcheck:
      # REDISCLI_AUTH — пароль redis-cli из окружения (без -a в argv)
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli -p \"$$REDIS_PORT\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- RabbitMQ ---
  rabbitmq:
    image: rabbitmq:3.13.3-management-alpine
    container_name: ubc-rabbitmq
    # фиксированное имя узла (rabbit@rabbitmq): иначе при каждом пересоздании
    # контейнера создаётся новая база mnesia — пользователи и очереди теряются
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      # fail-fast: без явных учётных данных контейнер не стартует (не guest/guest)
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
      # порты — из .env (проброс ниже использует те же переменные)
      RABBITMQ_NODE_PORT: ${RABBITMQ_PORT}
    volumes:
      - ${RABBITMQ_DATA_DIR}:/var/lib/rabbitmq
    networks:
      - backend
    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  backend:
    name: ubc-backend
  frontend:
    name: ubc-frontend
